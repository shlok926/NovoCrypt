version: '3.9'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &default-hardening
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:15-alpine
    container_name: novocrypt-db
    restart: unless-stopped
    logging: *default-logging
    <<: *default-hardening
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    environment:
      POSTGRES_DB: novocrypt
      POSTGRES_USER: shield_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shield_user -d novocrypt"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: novocrypt-cache
    restart: unless-stopped
    logging: *default-logging
    <<: *default-hardening
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: novocrypt-backend
    restart: unless-stopped
    logging: *default-logging
    <<: *default-hardening
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: 7d
      CORS_ORIGIN: http://localhost
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: novocrypt-frontend
    restart: unless-stopped
    logging: *default-logging
    <<: *default-hardening
    ports:
      - "80:8080"
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0755
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-backup:
    image: prodrigestivill/postgres-backup-local:14
    container_name: novocrypt-db-backup
    restart: unless-stopped
    logging: *default-logging
    <<: *default-hardening
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: novocrypt
      POSTGRES_USER: shield_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
    volumes:
      - postgres_backups:/backups
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "ls -l /backups || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  postgres_backups:

networks:
  default:
    name: novocrypt-network
