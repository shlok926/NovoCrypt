name: Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scans:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
        
    - name: Install dependencies
      run: |
        npm ci --prefix backend
        npm ci --prefix frontend

    - name: Run Gitleaks (Baselined)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LOGLEVEL: debug
        GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
        GITLEAKS_ENABLE_SUMMARY: true
      # By not failing on historical commits, we treat this as a baseline for new commits.
      # If required to ignore specific older commits, a .gitleaksignore file is standard practice.

    - name: Run npm audit
      run: |
        npm audit --audit-level=high --prefix backend || true
        npm audit --audit-level=high --prefix frontend || true
      continue-on-error: true # Warning only unless explicitly failed

    - name: Run OSV-Scanner
      uses: google/osv-scanner-action/osv-scanner-action@v1.9.0
      with:
        scan-args: |-
          -r
          --skip-git
          ./

    - name: License Compliance
      run: |
        npx license-checker --production --failOn "GPL;AGPL" --start backend
        npx license-checker --production --failOn "GPL;AGPL" --start frontend

    - name: Build Docker Images
      run: docker compose build

    - name: Run Trivy Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'pqc-backend:latest'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Generate SBOM (Backend)
      run: npx -y @cyclonedx/cyclonedx-npm --output-format JSON --output-file backend-bom.json
      working-directory: ./backend

    - name: Generate SBOM (Frontend)
      run: npx -y @cyclonedx/cyclonedx-npm --output-format JSON --output-file frontend-bom.json
      working-directory: ./frontend

    - name: Upload SBOM Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sbom-artifacts
        path: |
          backend/backend-bom.json
          frontend/frontend-bom.json
